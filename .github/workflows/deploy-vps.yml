name: Auto Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vps-deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=2048

  deploy:
    needs: build
    runs-on: ${{ vars.SELF_HOSTED == '1' && 'self-hosted' || 'ubuntu-latest' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT }}
    steps:
      - name: Deploy on VPS (self-hosted runner)
        if: vars.SELF_HOSTED == '1'
        run: |
          set -euo pipefail
          cd /home/deploy/AinComputerStore
          git remote set-url origin https://github.com/aeencomp/AinComputerStore1.git || true
          git fetch --all --prune
          git reset --hard origin/main
          chmod +x ./deploy.sh
          ./deploy.sh

      - name: Validate SSH deploy settings
        if: vars.SELF_HOSTED != '1'
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::error::Set VPS_HOST and VPS_USER (secrets or variables). VPS_USER should be deploy."
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::Set VPS_SSH_KEY as a repository Secret (full private key)."
            exit 1
          fi

      - name: Deploy over OpenSSH
        if: vars.SELF_HOSTED != '1'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/vps_deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=30 \
            "${VPS_USER}@${VPS_HOST}" \
            "set -e; cd /home/deploy/AinComputerStore; git remote set-url origin https://github.com/aeencomp/AinComputerStore1.git || true; git fetch --all --prune; git reset --hard origin/main; chmod +x ./deploy.sh; ./deploy.sh"
