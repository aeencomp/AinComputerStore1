name: Auto Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vps-deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=2048

  deploy:
    needs: build
    runs-on: ${{ vars.SELF_HOSTED == '1' && 'self-hosted' || 'ubuntu-latest' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT }}
    steps:
      - name: Deploy on VPS (self-hosted runner)
        if: vars.SELF_HOSTED == '1'
        run: |
          set -euo pipefail
          cd /home/deploy/AinComputerStore
          git remote set-url origin https://github.com/aeencomp/AinComputerStore1.git || true
          git fetch --all --prune
          git reset --hard origin/main
          chmod +x ./deploy.sh
          ./deploy.sh

      - name: Validate SSH deploy settings
        if: vars.SELF_HOSTED != '1'
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::error::Set VPS_HOST (secret or variable)"
            exit 1
          fi
          if [ -z "$VPS_USER" ]; then
            echo "::error::Set VPS_USER (secret or variable). Use deploy unless you intentionally SSH as root."
            exit 1
          fi
          echo "SSH deploy target: user=$VPS_USER port=${VPS_PORT:-22}"

      - name: Prepare SSH private key
        if: vars.SELF_HOSTED != '1'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Missing VPS_SSH_KEY repository secret. Settings → Secrets and variables → Actions → New repository secret. Use the full private key (including BEGIN/END lines). Do not store keys in Variables."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key

      - name: Deploy over SSH
        if: vars.SELF_HOSTED != '1'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key_path: ~/.ssh/vps_deploy_key
          port: ${{ env.VPS_PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          debug: true
          script_stop: true
          script: |
            set -e
            echo "==> Connected as $(whoami) on $(hostname)"
            DEPLOY_DIR=/home/deploy/AinComputerStore
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Missing $DEPLOY_DIR"
              exit 1
            fi
            if [ "$(whoami)" = "deploy" ]; then
              cd "$DEPLOY_DIR"
              git remote set-url origin https://github.com/aeencomp/AinComputerStore1.git || true
              git fetch --all --prune
              git reset --hard origin/main
              chmod +x ./deploy.sh
              ./deploy.sh
            else
              su - deploy -c "set -e; cd $DEPLOY_DIR; git remote set-url origin https://github.com/aeencomp/AinComputerStore1.git || true; git fetch --all --prune; git reset --hard origin/main; chmod +x ./deploy.sh; ./deploy.sh"
            fi
